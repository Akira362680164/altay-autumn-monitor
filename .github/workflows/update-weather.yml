name: Update Altay Weather Monitor

on:
  workflow_dispatch:
  schedule:
    # 10:30 Asia/Shanghai = 02:30 UTC. GitHub Actions cron is UTC.
    - cron: "30 2 * * *"

permissions:
  contents: write

concurrency:
  group: altay-weather-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch Open-Meteo data and write artifacts
        id: pipeline
        continue-on-error: true
        run: python src/pipeline.py

      - name: Commit generated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest data/archive
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
          else
            git commit -m "chore: update weather data"
            git push
          fi

      - name: Surface unexpected pipeline failure
        if: steps.pipeline.outcome == 'failure'
        run: exit 1
